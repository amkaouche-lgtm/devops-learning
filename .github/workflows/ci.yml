name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check hello.sh
        run: test -f hello.sh

      - name: Run hello.sh
        run: bash hello.sh

      - name: Run test
        run: bash test.sh
