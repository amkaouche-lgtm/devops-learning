name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check hello.sh
        run: test -f hello.sh

      - name: Run hello.sh
        run: bash hello.sh

      - name: Run test
        run: bash test.sh

      - name: Build Docker image
        run: docker build -t ghcr.io/amkaouche-lgtm/devops-app:latest.
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Docker image
        run: docker push ghcr.io/amkaouche-lgtm/devops-app:latest

